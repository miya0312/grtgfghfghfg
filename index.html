<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PULSE｜図形ローグライク</title>
<style>
:root{--bg:#14121f;--fg:#f2efe6;--a:#ffd23f;--b:#3ee6c3;--c:#ff5d73}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;font-size:15px;display:flex;justify-content:space-between}
#xp{position:absolute;left:0;right:0;bottom:0;height:6px;background:#ffffff18}
#xpf{height:100%;width:0;background:var(--b)}
#panel{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#14121fe6;pointer-events:auto;padding:16px}
#panel h1{margin:0 0 8px;font-size:28px;color:var(--a);text-align:center}
.card{width:min(340px,86vw);padding:14px 16px;border:2px solid var(--b);background:#201d33;color:var(--fg);font-size:16px;text-align:left;cursor:pointer;border-radius:6px}
.card:hover,.card:focus-visible{background:var(--b);color:#14121f;outline:none}
.card b{display:block;font-size:18px;margin-bottom:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud"><span id="t1"></span><span id="t2"></span></div>
  <div id="xp"><div id="xpf"></div></div>
  <div id="panel"></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

// ---- 音(WebAudioで生成。ファイル不要) ----
let AC;
function snd(f,d=.08,type='square',v=.06,slide=0){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),AC.currentTime+d);
  g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}
}

// ---- 入力 ----
const keys={};let mx=null,my=null;
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY});
cv.addEventListener('pointermove',e=>{if(mx!==null){mx=e.clientX;my=e.clientY}});
addEventListener('pointerup',()=>{mx=null});

// ---- 状態 ----
let P,E,B,F,T,shake,flash,time,kills,level,xp,need,state,spawnT,best=+localStorage.getItem('pulse_best')||0;
const UPG=[
 {n:'連射',d:'発射間隔 -18%',f:()=>P.rate*=.82},
 {n:'マルチショット',d:'弾が1本増える',f:()=>P.multi++},
 {n:'火力',d:'ダメージ +40%',f:()=>P.dmg*=1.4},
 {n:'加速',d:'移動速度 +20%',f:()=>P.spd*=1.2},
 {n:'貫通',d:'弾が敵を1体貫通する',f:()=>P.pierce++},
 {n:'マグネット',d:'経験値の吸引範囲 2倍',f:()=>P.mag*=2},
 {n:'オーラ',d:'周囲の敵に継続ダメージ',f:()=>P.aura+=1},
 {n:'回復',d:'HPを全回復',f:()=>P.hp=P.max},
];
function reset(){
  P={x:W/2,y:H/2,r:12,hp:5,max:5,spd:200,rate:.5,cd:0,multi:1,dmg:1,pierce:0,mag:70,aura:0,inv:0,pop:0};
  E=[];B=[];F=[];T=[];shake=0;flash=0;time=0;kills=0;level=1;xp=0;need=5;spawnT=0;state='play';
  document.getElementById('panel').style.display='none';
}
function title(){
  state='title';const p=document.getElementById('panel');p.style.display='flex';
  p.innerHTML=`<h1>PULSE</h1><div style="text-align:center;line-height:1.7">動かす:WASD / 矢印 / 画面ドラッグ<br>攻撃は自動。倒して強化を選ぼう<br>ベスト生存 ${best.toFixed(1)}秒</div><button class="card" style="text-align:center" id="go"><b>スタート</b></button>`;
  document.getElementById('go').onclick=()=>{snd(500,.1);reset()};
}
function levelUp(){
  state='pick';level++;xp-=need;need=Math.floor(need*1.35+2);snd(660,.25,'triangle',.08,500);
  const pool=[...UPG].sort(()=>Math.random()-.5).slice(0,3);
  const p=document.getElementById('panel');p.style.display='flex';
  p.innerHTML='<h1>LEVEL '+level+'</h1>'+pool.map((u,i)=>`<button class="card" data-i="${i}"><b>${u.n}</b>${u.d}</button>`).join('');
  p.querySelectorAll('.card').forEach(b=>b.onclick=()=>{pool[b.dataset.i].f();snd(880,.12,'triangle');p.style.display='none';state='play';P.pop=1});
}
function burst(x,y,col,n=8){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*160;F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.35,col})}}
function dmgText(x,y,t,col='#fff'){T.push({x,y,t,l:.6,col})}
function hit(e,d,vx,vy){
  e.hp-=d;e.pop=1;e.kx=vx*.4;e.ky=vy*.4;dmgText(e.x,e.y-e.r,Math.ceil(d*10));snd(220+Math.random()*80,.05,'square',.04);
  if(e.hp<=0&&!e.dead){e.dead=1;kills++;shake=Math.min(shake+3,8);burst(e.x,e.y,e.col,10);snd(120,.14,'sawtooth',.06,-60);
    F.push({gem:1,x:e.x,y:e.y,vx:0,vy:0,l:99,col:'#3ee6c3'})}
}

// ---- 更新 ----
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(state==='play')update(dt);
  draw();requestAnimationFrame(loop);
}
function update(dt){
  time+=dt;spawnT-=dt;
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(mx!==null){const vx=mx-P.x,vy=my-P.y,m=Math.hypot(vx,vy);if(m>12){dx=vx/m;dy=vy/m}}
  const m=Math.hypot(dx,dy)||1;P.x=Math.max(P.r,Math.min(W-P.r,P.x+dx/m*P.spd*dt*(dx||dy?1:0)));
  P.y=Math.max(P.r,Math.min(H-P.r,P.y+dy/m*P.spd*dt*(dx||dy?1:0)));
  P.inv-=dt;P.pop=Math.max(0,P.pop-dt*4);shake*=.88;flash=Math.max(0,flash-dt*3);

  // 敵スポーン(時間で増える)
  if(spawnT<=0){
    spawnT=Math.max(.18,.9-time*.012);
    const n=1+Math.floor(time/25);
    for(let i=0;i<n;i++){
      const s=Math.floor(Math.random()*4),x=s<2?Math.random()*W:(s==2?-20:W+20),y=s>=2?Math.random()*H:(s==0?-20:H+20);
      const big=Math.random()<Math.min(.25,time/300);
      const r=big?20:11;
      E.push({x,y,r,hp:(big?6:1.5)*(1+time/90),spd:(big?55:80)+Math.random()*20+time*.4,col:big?'#ff5d73':'#ff9a5d',kx:0,ky:0,pop:0,tri:!big})
    }
  }
  // 自動攻撃
  P.cd-=dt;
  if(P.cd<=0&&E.length){
    P.cd=P.rate;
    const t=[...E].sort((a,b)=>Math.hypot(a.x-P.x,a.y-P.y)-Math.hypot(b.x-P.x,b.y-P.y))[0];
    const base=Math.atan2(t.y-P.y,t.x-P.x);
    for(let i=0;i<P.multi;i++){
      const a=base+(i-(P.multi-1)/2)*.18;
      B.push({x:P.x,y:P.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,l:1.2,pl:P.pierce,hit:new Set()});
    }
    snd(700+Math.random()*100,.04,'square',.03);
  }
  // 弾
  for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    for(const e of E){if(e.dead||b.hit.has(e))continue;
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+5){b.hit.add(e);hit(e,P.dmg,b.vx,b.vy);if(b.pl-- <=0){b.l=0;break}}}}
  B=B.filter(b=>b.l>0);
  // 敵
  for(const e of E){
    const a=Math.atan2(P.y-e.y,P.x-e.x);
    e.x+=Math.cos(a)*e.spd*dt+e.kx*dt;e.y+=Math.sin(a)*e.spd*dt+e.ky*dt;e.kx*=.9;e.ky*=.9;e.pop=Math.max(0,e.pop-dt*8);
    const d=Math.hypot(P.x-e.x,P.y-e.y);
    if(P.aura&&d<50+P.aura*18)hit(e,P.aura*dt*2.2,0,0);
    if(d<e.r+P.r&&P.inv<=0&&!e.dead){P.hp--;P.inv=1;shake=14;flash=1;snd(90,.3,'sawtooth',.1,-40);burst(P.x,P.y,'#ff5d73',16);
      if(P.hp<=0){gameOver();return}}
  }
  E=E.filter(e=>!e.dead);
  // 経験値・パーティクル(自前の簡易)
  for(const f of F){
    f.l-=dt;
    if(f.gem){const d=Math.hypot(P.x-f.x,P.y-f.y);
      if(d<P.mag){const a=Math.atan2(P.y-f.y,P.x-f.x);f.x+=Math.cos(a)*380*dt;f.y+=Math.sin(a)*380*dt}
      if(d<P.r+6){f.l=0;xp++;snd(900+Math.min(xp,10)*40,.05,'triangle',.04);if(xp>=need){levelUp();break}}}
    else{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92}
  }
  F=F.filter(f=>f.l>0);
  for(const t of T){t.y-=40*dt;t.l-=dt}T=T.filter(t=>t.l>0);
}
function gameOver(){
  state='over';const nb=time>best;if(nb){best=time;localStorage.setItem('pulse_best',best)}
  const p=document.getElementById('panel');p.style.display='flex';
  p.innerHTML=`<h1>${nb?'新記録!':'ゲームオーバー'}</h1><div style="text-align:center;line-height:1.8">生存 ${time.toFixed(1)}秒 ／ 撃破 ${kills}<br>ベスト ${best.toFixed(1)}秒</div><button class="card" style="text-align:center" id="rt"><b>もう1回</b></button>`;
  document.getElementById('rt').onclick=()=>{snd(500,.1);reset()};
}

// ---- 描画 ----
function draw(){
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg');ctx.fillRect(0,0,W,H);
  if(!P)return;
  ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  for(const f of F){ctx.globalAlpha=f.gem?1:f.l*2.5;ctx.fillStyle=f.col;
    if(f.gem){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(.785);ctx.fillRect(-4,-4,8,8);ctx.restore()}
    else ctx.fillRect(f.x-2,f.y-2,4,4)}
  ctx.globalAlpha=1;
  if(P.aura){ctx.strokeStyle='#3ee6c366';ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y,50+P.aura*18,0,6.28);ctx.stroke()}
  for(const e of E){const s=1+e.pop*.35;ctx.fillStyle=e.pop>.5?'#fff':e.col;ctx.save();ctx.translate(e.x,e.y);ctx.scale(s,s);
    ctx.beginPath();if(e.tri){const a=Math.atan2(P.y-e.y,P.x-e.x);for(let i=0;i<3;i++){const t=a+i*2.094;ctx.lineTo(Math.cos(t)*e.r*1.2,Math.sin(t)*e.r*1.2)}}
    else ctx.rect(-e.r,-e.r,e.r*2,e.r*2);ctx.fill();ctx.restore()}
  ctx.fillStyle='#ffd23f';for(const b of B){ctx.beginPath();ctx.arc(b.x,b.y,4,0,6.28);ctx.fill()}
  const ps=1+P.pop*.5;ctx.save();ctx.translate(P.x,P.y);ctx.scale(ps,ps);
  ctx.globalAlpha=P.inv>0&&Math.floor(P.inv*20)%2?.3:1;ctx.fillStyle='#3ee6c3';ctx.beginPath();ctx.arc(0,0,P.r,0,6.28);ctx.fill();
  ctx.fillStyle='#14121f';ctx.beginPath();ctx.arc(0,0,4,0,6.28);ctx.fill();ctx.restore();ctx.globalAlpha=1;
  ctx.font='bold 16px sans-serif';ctx.textAlign='center';
  for(const t of T){ctx.globalAlpha=Math.min(1,t.l*3);ctx.fillStyle=t.col;ctx.fillText(t.t,t.x,t.y)}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,93,115,${flash*.35})`;ctx.fillRect(0,0,W,H)}
  document.getElementById('t1').textContent='HP '+'♥'.repeat(Math.max(0,P.hp))+'  Lv'+level;
  document.getElementById('t2').textContent=time.toFixed(1)+'秒 ／ 撃破 '+kills;
  document.getElementById('xpf').style.width=Math.min(100,xp/need*100)+'%';
}
reset();title();requestAnimationFrame(loop);
</script>
</body>
</html>
